name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy

      - name: Smoke-test source entry point
        run: |
          uv run pi-agent --version
          uv run pi-agent --help

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test wheel
        run: |
          uv venv .smoke-wheel
          uv pip install --python .smoke-wheel/bin/python dist/*.whl
          .smoke-wheel/bin/python -c "import pi_ai, pi_agent, pi_coding"
          .smoke-wheel/bin/pi-agent --version
          .smoke-wheel/bin/pi-agent --help

      - name: Smoke-test source distribution
        run: |
          uv venv .smoke-sdist
          uv pip install --python .smoke-sdist/bin/python dist/*.tar.gz
          .smoke-sdist/bin/python -c "import pi_ai, pi_agent, pi_coding"
          .smoke-sdist/bin/pi-agent --version
          .smoke-sdist/bin/pi-agent --help
