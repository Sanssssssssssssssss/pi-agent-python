name: Bug report
description: Report a reproducible Pi Agent for Python problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to provide a reproducible report.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pi-agent --version` or the commit SHA.
      placeholder: pi-agent 0.1.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest command or code sample that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs or a traceback. Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Provider, model, terminal, configuration, or screenshots if relevant.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, credentials, private prompts, and session content.
          required: true
